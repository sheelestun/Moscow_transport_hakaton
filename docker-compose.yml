# Moscow Transport Hackathon — оркестрация всех сервисов для локального запуска.
# Запуск: docker compose up -d (эмулятор предварительно загрузить, см. секцию ndtp-emu).
# Compose Specification (без устаревшего ключа `version`).

networks:
  # Единая сеть — все сервисы обращаются друг к другу по service-name.
  msk:
    driver: bridge

volumes:
  # Persistent-хранилище для Postgres (метаданные, логи предсказаний, справочники).
  postgres-data:

services:

  ml:
    # Наш инференс-сервис: FastAPI + CatBoost-ансамбль.
    build: ./ml
    container_name: msk-ml
    ports:
      - "8001:8001"
    volumes:
      # Модели монтируем read-only, чтобы можно было обновлять артефакты без rebuild.
      - ./ml/artifacts:/app/artifacts:ro
    environment:
      ML_MODEL_VERSION: catboost-ensemble-v1
    networks:
      - msk
    healthcheck:
      # /health определён в ml/src/inference_service.py, curl уже в образе.
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  backend:
    # Диспетчерский шлюз: FastAPI + WebSocket, симулирует движение ТС по маршрутам
    # и вызывает ML `/whatif/predict`. Контракт — как в `frontend/js/api.js`.
    build: ./backend
    container_name: msk-backend
    ports:
      - "8000:8000"
    environment:
      # ML доступен по service-name в общей сети `msk`.
      ML_URL: http://ml:8001
      ML_MODEL_VERSION: catboost-ensemble-v1
      BACKEND_TICK_S: "1.0"
      BACKEND_SPEED_FACTOR: "5.0"
    depends_on:
      ml:
        condition: service_healthy
    networks:
      - msk
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    # SPA под nginx (см. frontend/Dockerfile). Внутри контейнера слушает 80.
    build: ./frontend
    container_name: msk-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - msk
    restart: unless-stopped

  redis:
    # Шина realtime-событий + feature-store с TTL.
    image: redis:7-alpine
    container_name: msk-redis
    # Порт наружу не пробрасываем — только внутри сети msk.
    expose:
      - "6379"
    networks:
      - msk
    restart: unless-stopped

  postgres:
    # Метаданные, история предсказаний, справочники маршрутов/остановок.
    image: postgres:16-alpine
    container_name: msk-postgres
    environment:
      POSTGRES_USER: msk
      POSTGRES_PASSWORD: msk
      POSTGRES_DB: msk_transport
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - msk
    restart: unless-stopped

  # ВНИМАНИЕ: перед первым запуском загрузить образ эмулятора командой:
  #   docker load -i dataset/ndtp-telemetry-emulator.tar
  # Образ поставляется как OCI-архив, в Docker Hub его нет.
  ndtp-emu:
    # Java Spring Boot — эмулирует поток NDTP-телеметрии по TCP на targetHost:targetPort.
    image: ndtp-telemetry-emulator:1.0
    container_name: msk-ndtp-emu
    ports:
      # HTTP-управление: POST /api/config, GET /api/cells.
      - "18080:18080"
    depends_on:
      - backend
    networks:
      - msk
    restart: unless-stopped
