name: tests

# Гоняется на каждом пуше и PR: быстрые smoke-тесты backend + ML без docker.
# Живой стек (компоуз) — вручную через `docker compose up`, здесь только логика.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r ml/requirements.txt pytest httpx
      - name: Run pytest
        run: pytest

  jssyntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check frontend JS (без запуска браузера)
        run: |
          node -e "
            const vm = require('vm'); const fs = require('fs');
            for (const f of ['frontend/js/app.js','frontend/js/sidebar.js','frontend/js/mock.js','frontend/js/api.js','frontend/js/map.js']) {
              new vm.Script(fs.readFileSync(f,'utf8'), { filename: f });
              console.log(f, 'OK');
            }"
